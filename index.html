<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIALING | 未来主义作品集</title>
    <style>
        :root {
            --accent: #fff700;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background: #000; color: #fff; font-family: "Inter", -apple-system, sans-serif; overflow-x: hidden; }

        /* --- 1. 液态背景系统 --- */
        .bg-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #080808, #000);
            z-index: -2;
        }

        /* 模拟参考图中的液态光影 */
        .liquid-blob {
            position: absolute; width: 600px; height: 600px;
            background: linear-gradient(135deg, rgba(0, 230, 255, 0.15), rgba(255, 0, 255, 0.1));
            filter: blur(80px); border-radius: 50%;
            animation: move 20s infinite alternate ease-in-out;
            z-index: -1;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) rotate(0deg); }
            to { transform: translate(20%, 10%) rotate(360deg); }
        }

        /* --- 2. 自定义鼠标 --- */
        #cursor { width: 20px; height: 20px; border: 1.5px solid #fff; position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999; transition: transform 0.1s; mix-blend-mode: difference; }

        /* --- 3. 玻璃导航栏 --- */
        nav {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1200px; padding: 20px 40px;
            background: var(--glass); border: 1px solid var(--border);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 100px; display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        /* --- 4. 英雄展示区 (重点：模拟 3D 悬浮) --- */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }

        .ip-stage {
            position: relative; width: 300px; height: 300px;
            display: flex; justify-content: center; align-items: center;
        }

        /* 模拟参考图中的底座光影 */
        .ip-stage::before {
            content: ''; position: absolute; bottom: 10%; width: 150px; height: 40px;
            background: rgba(255, 247, 0, 0.2); filter: blur(20px); border-radius: 50%;
            animation: shadowPulse 3s infinite ease-in-out;
        }

        .ip-stage video {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.8));
            animation: float 4s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .hero h1 {
            font-size: 5rem; font-weight: 800; letter-spacing: -3px; margin-top: -20px;
            background: linear-gradient(to bottom, #fff, rgba(255,255,255,0.3));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- 5. 液态卡片展示区 --- */
        .projects { padding: 100px 10%; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; }

        .card {
            background: var(--glass); border: 1px solid var(--border); border-radius: 40px;
            padding: 10px; transition: 0.5s; position: relative; overflow: hidden;
        }

        /* 参考图中的微光勾边效果 */
        .card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.02) translateY(-10px);
        }

        .card-inner {
            background: rgba(0,0,0,0.4); border-radius: 32px; padding: 30px; height: 100%;
        }

        .card-img {
            width: 100%; height: 280px; background: #111; border-radius: 24px; margin-bottom: 20px;
            overflow: hidden; border: 1px solid var(--border);
        }

        .card-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 1s; }
        .card:hover .card-img img { opacity: 1; transform: scale(1.1); }

    </style>
</head>
<body>

    <div id="cursor"></div>
    <div class="bg-wrapper">
        <div class="liquid-blob"></div>
        <div class="liquid-blob" style="right: 0; bottom: 0; animation-delay: -5s;"></div>
    </div>

    <nav>
        <div style="font-weight: 800;">JIALING.</div>
        <div style="display: flex; gap: 30px; font-size: 14px;">
            <a href="#" style="color:#fff; text-decoration:none;">作品集</a>
            <a href="#" style="color:#666; text-decoration:none;">个人简历</a>
        </div>
    </nav>

    <section class="hero">
        <div class="ip-stage">
            <video autoplay loop muted playsinline>
                <source src="ip-motion.mp4" type="video/mp4">
            </video>
        </div>
        <h1>Design Fusion.</h1>
        <p style="color: #666; letter-spacing: 5px; margin-top: 10px;">探索深色美学与流动交互的极限</p>
    </section>

    <section class="projects">
        <div class="card">
            <div class="card-inner">
                <div class="card-img"></div>
                <h3 style="font-size: 1.5rem;">未来主义 UI 系统</h3>
                <p style="color: #444; margin-top: 10px;">基于 Vision Pro 的空间设计探索</p>
            </div>
        </div>
        </section>

    <script>
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate(${e.clientX - 10}px, ${e.clientY - 10}px)`;
        });

        // 简单的入场动画触发
        const cards = document.querySelectorAll('.card');
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if(entry.isIntersecting) entry.target.style.opacity = 1;
            });
        });
        cards.forEach(card => {
            card.style.opacity = 0;
            observer.observe(card);
        });
    </script>
</body>
</html>
