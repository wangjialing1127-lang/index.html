<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIALING | 动态作品集</title>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #0071ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, "SF Pro Display", sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- 1. 背景流光动效 --- */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(22, 171, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(245, 198, 203, 0.1) 0%, transparent 40%);
            filter: blur(100px);
            z-index: -1;
            animation: pulseBg 10s infinite alternate ease-in-out;
        }

        @keyframes pulseBg {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(5%, 5%); }
        }

        /* --- 2. 鼠标跟随 --- */
        #cursor-dot { width: 8px; height: 8px; background: #fff; position: fixed; border-radius: 50%; pointer-events: none; z-index: 1000; }
        #cursor-outline { width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.4); position: fixed; border-radius: 50%; pointer-events: none; z-index: 999; transition: all 0.2s ease-out; }

        /* --- 3. 导航栏 --- */
        nav {
            position: fixed; top: 20px; width: 90%; max-width: 1200px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 40px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }

        /* --- 4. 英雄区 --- */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { 
            font-size: clamp(2.5rem, 8vw, 5.5rem); font-weight: 800; letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff 40%, rgba(255,255,255,0.4));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: fadeInDown 1.2s ease-out;
        }
        .hero p { color: #888; margin-top: 20px; opacity: 0; animation: fadeIn 1s 0.5s forwards; }

        /* --- 5. 作品卡片动效 --- */
        .projects { padding: 50px 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; max-width: 1400px; margin: 0 auto; }
        
        .card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px; padding: 24px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0; transform: translateY(40px); /* 初始隐藏 */
        }

        .card.show { opacity: 1; transform: translateY(0); } /* 入场动画状态 */

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .card-img { width: 100%; height: 260px; background: #1a1a1a; border-radius: 20px; margin-bottom: 20px; overflow: hidden; position: relative; }
        
        /* 图片内缩放效果 */
        .card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s ease; }
        .card:hover .card-img img { transform: scale(1.1); }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>
    <div class="bg-glow"></div>

    <nav>
        <div style="font-weight: 800; letter-spacing: 1px;">JIALING.</div>
        <div style="display: flex; gap: 25px; font-size: 14px;">
            <a href="#" style="color: #fff; text-decoration: none;">WORKS</a>
            <a href="#" style="color: #666; text-decoration: none;">ABOUT</a>
        </div>
    </nav>

    <section class="hero">
        <h1 id="hero-title">ING. WORK COLLECTION</h1>
        <p>广告艺术设计 | 射手座的自由与创意</p>
    </section>

    <section class="projects" id="project-section">
        <div class="card">
            <div class="card-img"><div style="width:100%;height:100%;background:linear-gradient(45deg,#222,#333);"></div></div>
            <h3>基础平面设计</h3>
            <p style="color: #666; font-size: 13px;">BASIC GRAPHICS</p>
        </div>
        <div class="card">
            <div class="card-img"><div style="width:100%;height:100%;background:linear-gradient(135deg,#1a1a1a,#2a2a2a);"></div></div>
            <h3>IP & 插画设计</h3>
            <p style="color: #666; font-size: 13px;">IP & ILLUSTRATION</p>
        </div>
        <div class="card">
            <div class="card-img"><div style="width:100%;height:100%;background:linear-gradient(225deg,#222,#333);"></div></div>
            <h3>文创产品设计</h3>
            <p style="color: #666; font-size: 13px;">CULTURAL CREATIVE</p>
        </div>
    </section>

    <script>
        // 1. 鼠标跟随逻辑
        const dot = document.getElementById('cursor-dot');
        const outline = document.getElementById('cursor-outline');
        
        window.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            outline.animate({ left: e.clientX + 'px', top: e.clientY + 'px' }, { duration: 400, fill: "forwards" });
            
            // 视差微调标题
            const moveX = (e.clientX - window.innerWidth/2) * 0.01;
            const moveY = (e.clientY - window.innerHeight/2) * 0.01;
            document.getElementById('hero-title').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // 2. 卡片滚动入场动画 (Intersection Observer)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('show');
                    }, index * 150); // 间隔入场
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.card').forEach(card => observer.observe(card));

        // 3. Hover 交互
        document.querySelectorAll('.card, a').forEach(item => {
            item.addEventListener('mouseenter', () => {
                outline.style.transform = 'scale(1.5)';
                outline.style.borderColor = '#0071ff';
                outline.style.backgroundColor = 'rgba(0, 113, 255, 0.1)';
            });
            item.addEventListener('mouseleave', () => {
                outline.style.transform = 'scale(1)';
                outline.style.borderColor = 'rgba(255,255,255,0.4)';
                outline.style.backgroundColor = 'transparent';
            });
        });
    </script>
</body>
</html>
