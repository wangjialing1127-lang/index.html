<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIALING | Visual Designer Portfolio</title>
    <style>
        :root {
            --accent: #fff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background: var(--bg-dark); color: #fff; font-family: "SF Pro Display", sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        /* --- 1. 背景：增加 screen 模式，光感更通透 --- */
        .bg-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; overflow: hidden; background: #000;
        }
        .blob {
            position: absolute; width: 65vw; height: 65vw;
            border-radius: 50%; opacity: 0.3; 
            mix-blend-mode: screen; /* 关键：让颜色叠加更亮眼 */
            filter: blur(100px);
            animation: move 25s infinite alternate ease-in-out;
        }
        .blob-1 { background: radial-gradient(circle, #2a45ff 0%, transparent 70%); top: -10%; left: -10%; }
        .blob-2 { background: radial-gradient(circle, #6020ff 0%, transparent 70%); bottom: -10%; right: -10%; animation-delay: -5s; }
        
        .glass-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px);
            background: rgba(0, 0, 0, 0.2);
        }

        @keyframes move {
            0% { transform: translate(-5%, -5%); }
            100% { transform: translate(15%, 15%); }
        }

        /* --- 2. 导航栏：增加“内发光”边缘，更有玻璃厚度感 --- */
        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1000px; padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 100px; display: flex; justify-content: space-between; align-items: center; z-index: 1000;
            /* 组合阴影：内发光 + 外部深投影 */
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.1), 
                0 20px 40px rgba(0, 0, 0, 0.5); 
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .nav-logo img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); }
        .nav-links { display: flex; gap: 30px; font-size: 13px; letter-spacing: 1px; }
        .nav-links a { color: rgba(255,255,255,0.5); text-decoration: none; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }

        /* --- 3. 英雄区：添加浮现动画 --- */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; }
        
        /* 动画定义 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .hero h1, .hero-sub, .cta-group {
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .hero-sub { animation-delay: 0.2s; }
        .cta-group { animation-delay: 0.4s; }

        .hero-label { font-size: 14px; color: rgba(255,255,255,0.4); letter-spacing: 4px; margin-bottom: 20px; }
        .hero h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 800; line-height: 1; letter-spacing: -3px; }
        .hero h1 span { color: rgba(255,255,255,0.2); }
        .hero-sub { 
            max-width: 650px; margin: 30px 0 50px; color: rgba(255, 255, 255, 0.5); 
            font-size: 1.1rem; line-height: 1.8; letter-spacing: 0.05em; 
        }

        .btn { 
            padding: 16px 35px; border-radius: 100px; text-decoration: none; font-size: 14px; font-weight: 500;
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border);
        }
        .btn-primary { background: #fff; color: #000; }
        .btn-primary:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(255,255,255,0.15); }
        .btn-secondary { color: #fff; background: var(--glass); backdrop-filter: blur(10px); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        /* --- 4. 作品展示区 --- */
        .work-section { padding: 100px 10%; }
        .section-title { font-size: 14px; color: rgba(255,255,255,0.3); margin-bottom: 60px; letter-spacing: 5px; text-transform: uppercase; }
        .work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        .work-card { 
            background: var(--glass); border: 1px solid var(--border); border-radius: 30px;
            padding: 15px; text-decoration: none; color: #fff; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .work-card:hover { transform: translateY(-10px); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.06); }
        .work-img { width: 100%; aspect-ratio: 16/10; background: #111; border-radius: 20px; overflow: hidden; }
        .work-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .work-info { padding: 25px 15px 15px; }
        .work-info h3 { font-size: 1.5rem; margin-bottom: 8px; }

        #cursor { width: 15px; height: 15px; background: #fff; position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: difference; transition: transform 0.1s; }

    </style>
</head>
<body>

    <div id="cursor"></div>
    <div class="bg-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="glass-overlay"></div>
    </div>

    <nav>
        <div class="nav-logo">
            <img src="ip.png" alt="IP">
            <span>JIALING W.</span>
        </div>
        <div class="nav-links">
            <a href="#work-01">PANTENE</a>
            <a href="#work-02">GIFTBOX</a>
            <a href="#about">ABOUT</a>
            <a href="mailto:jialing_design@foxmail.com">CONTACT</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-label">Visual Designer / Artist</div>
        <h1>Crafting brands<br><span>for the future.</span></h1>
        <p class="hero-sub">Jialing Wang. 专注于品牌视觉系统升级与数字化艺术设计。通过液态美学与逻辑叙事的交织，为品牌赋予更具生命力的数字化表达。</p>
        <div class="cta-group">
            <a href="#work-01" class="btn btn-primary">查看作品集</a>
            <a href="mailto:jialing_design@foxmail.com" class="btn btn-secondary">联系邮箱</a>
        </div>
    </section>

    <script>
        const cursor = document.getElementById('cursor');
        const bg = document.querySelector('.bg-container');

        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            const x = (e.clientX - window.innerWidth / 2) * 0.015;
            const y = (e.clientY - window.innerHeight / 2) * 0.015;
            bg.style.transform = `translate(${x}px, ${y}px)`;
        });

        document.querySelectorAll('a, .btn').forEach(link => {
            link.addEventListener('mouseenter', () => cursor.style.transform = 'scale(4)');
            link.addEventListener('mouseleave', () => cursor.style.transform = 'scale(1)');
        });
    </script>
</body>
</html>
