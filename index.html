<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIALING | Visual Designer Portfolio</title>
    <style>
        :root {
            --accent: #fff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --bg-dark: #050505;
        }

        /* 基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background: var(--bg-dark); color: #fff; font-family: "SF Pro Display", sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        /* --- 1. 背景层修复：确保光斑可见 --- */
        .bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
        .blob {
            position: absolute; width: 60vw; height: 60vw; border-radius: 50%; opacity: 0.4; 
            mix-blend-mode: screen; filter: blur(80px); animation: move 20s infinite alternate ease-in-out;
        }
        .blob-1 { background: radial-gradient(circle, #2a45ff 0%, transparent 70%); top: -10%; left: -10%; }
        .blob-2 { background: radial-gradient(circle, #6020ff 0%, transparent 70%); bottom: -10%; right: -10%; animation-delay: -5s; }
        
        /* 玻璃蒙版层 */
        .glass-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(60px); -webkit-backdrop-filter: blur(60px); pointer-events: none; }

        @keyframes move { 0% { transform: translate(-5%, -5%); } 100% { transform: translate(10%, 10%); } }

        /* --- 2. 动画核心：定义浮现动画 --- */
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* --- 3. 导航栏 --- */
        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1000px; padding: 12px 30px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 100px; display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .nav-logo img { width: 30px; height: 30px; border-radius: 50%; }
        .nav-links { display: flex; gap: 25px; font-size: 12px; letter-spacing: 1px; }
        .nav-links a { color: rgba(255,255,255,0.6); text-decoration: none; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }

        /* --- 4. 英雄区动画应用 --- */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; }
        
        /* 关键：给所有元素添加动画并预设透明度为 0 */
        .hero h1, .hero-sub, .cta-group, .hero-label {
            opacity: 0; 
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 设置进场节奏（Delay） */
        .hero-label { animation-delay: 0.2s; color: rgba(255,255,255,0.4); letter-spacing: 4px; margin-bottom: 20px; font-size: 14px; }
        .hero h1 { animation-delay: 0.4s; font-size: clamp(3rem, 10vw, 6rem); font-weight: 800; line-height: 1.1; letter-spacing: -2px; }
        .hero h1 span { color: rgba(255,255,255,0.25); }
        .hero-sub { animation-delay: 0.6s; max-width: 600px; margin: 30px 0 50px; color: rgba(255, 255, 255, 0.5); font-size: 1.1rem; line-height: 1.8; }
        .cta-group { animation-delay: 0.8s; display: flex; gap: 20px; }

        .btn { 
            padding: 16px 35px; border-radius: 100px; text-decoration: none; font-size: 14px; font-weight: 500;
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border);
        }
        .btn-primary { background: #fff; color: #000; }
        .btn-primary:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(255,255,255,0.15); }
        .btn-secondary { color: #fff; background: var(--glass); }

        /* --- 5. 作品区 --- */
        .work-section { padding: 100px 10%; }
        .section-title { font-size: 13px; color: rgba(255,255,255,0.3); margin-bottom: 60px; letter-spacing: 5px; text-transform: uppercase; }
        .work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        
        .work-card { 
            background: var(--glass); border: 1px solid var(--border); border-radius: 24px;
            padding: 12px; text-decoration: none; color: #fff;
            opacity: 0; 
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 作品紧随其后出现 */
        #work-01 { animation-delay: 1.0s; }
        #work-02 { animation-delay: 1.2s; }

        .work-card:hover { transform: translateY(-10px); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.06); }
        .work-img { width: 100%; aspect-ratio: 16/10; background: #111; border-radius: 18px; overflow: hidden; }
        .work-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 1s; }
        .work-info { padding: 20px 10px; }
        .work-info h3 { font-size: 1.3rem; margin-bottom: 5px; }
        .work-info p { color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 1px; }

        /* 鼠标跟随 */
        #cursor { width: 15px; height: 15px; background: #fff; position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: difference; transition: transform 0.1s; }

    </style>
</head>
<body>

    <div id="cursor"></div>
    
    <div class="bg-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="glass-overlay"></div>
    </div>

    <nav>
        <div class="nav-logo">
            <img src="ip.png" alt="IP">
            <span>JIALING W.</span>
        </div>
        <div class="nav-links">
            <a href="#work-01">PANTENE</a>
            <a href="#work-02">GIFTBOX</a>
            <a href="#about">ABOUT</a>
            <a href="mailto:jialing_design@foxmail.com">CONTACT</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-label">Visual Designer / Artist</div>
        <h1>Crafting brands<br><span>for the future.</span></h1>
        <p class="hero-sub">Jialing Wang. 专注于品牌视觉系统升级与数字化艺术设计。通过液态美学与逻辑叙事的交织，为品牌赋予更具生命力的数字化表达。</p>
        <div class="cta-group">
            <a href="#work-01" class="btn btn-primary">查看作品集</a>
            <a href="mailto:jialing_design@foxmail.com" class="btn btn-secondary">联系邮箱</a>
        </div>
    </section>

    <section class="work-section">
        <p class="section-title">Selected Projects</p>
        <div class="work-grid">
            <a href="#details" class="work-card" id="work-01">
                <div class="work-img">
                    <img src="pantene-kv.jpg" alt="Pantene Upgrade">
                </div>
                <div class="work-info">
                    <h3>Pantene Campaign Upgrade</h3>
                    <p>BRANDING / VISUAL SYSTEM / 2026</p>
                </div>
            </a>
            <a href="#details" class="work-card" id="work-02">
                <div class="work-img">
                    <img src="gift-box.jpg" alt="Luxury Box">
                </div>
                <div class="work-info">
                    <h3>高端礼盒包装设计</h3>
                    <p>PACKAGING DESIGN / LUXURY</p>
                </div>
            </a>
        </div>
    </section>

    <script>
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('a, .btn').forEach(link => {
            link.addEventListener('mouseenter', () => cursor.style.transform = 'scale(4)');
            link.addEventListener('mouseleave', () => cursor.style.transform = 'scale(1)');
        });
    </script>
</body>
</html>
