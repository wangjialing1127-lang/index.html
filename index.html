<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIALING | Visual Designer Portfolio</title>
    <style>
        :root {
            --accent: #fff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background: var(--bg-dark); color: #fff; font-family: "SF Pro Display", sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        /* --- 1. 背景层 --- */
        .bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: #000; }
        .blob {
            position: absolute; width: 65vw; height: 65vw; border-radius: 50%; opacity: 0.3; 
            mix-blend-mode: screen; filter: blur(100px); animation: move 25s infinite alternate ease-in-out;
        }
        .blob-1 { background: radial-gradient(circle, #2a45ff 0%, transparent 70%); top: -10%; left: -10%; }
        .blob-2 { background: radial-gradient(circle, #6020ff 0%, transparent 70%); bottom: -10%; right: -10%; animation-delay: -5s; }
        .glass-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px); }

        @keyframes move { 0% { transform: translate(-5%, -5%); } 100% { transform: translate(15%, 15%); } }

        /* --- 2. 动效核心：定义浮现动画 --- */
        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(40px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* --- 3. 导航栏 --- */
        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1000px; padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 100px; display: flex; justify-content: space-between; align-items: center; z-index: 1000;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* --- 4. 英雄区动画应用 --- */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; }
        
        .hero h1, .hero-sub, .cta-group, .hero-label {
            opacity: 0; /* 初始隐藏 */
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 设置进场顺序延迟 */
        .hero-label { animation-delay: 0.1s; }
        .hero h1 { animation-delay: 0.3s; }
        .hero-sub { animation-delay: 0.5s; }
        .cta-group { animation-delay: 0.7s; }

        .hero h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 800; line-height: 1; letter-spacing: -3px; }
        .hero h1 span { color: rgba(255,255,255,0.25); }
        .hero-sub { max-width: 650px; margin: 30px 0 50px; color: rgba(255, 255, 255, 0.5); font-size: 1.1rem; line-height: 1.8; letter-spacing: 0.05em; }

        .btn { 
            padding: 16px 35px; border-radius: 100px; text-decoration: none; font-size: 14px; font-weight: 500;
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border);
        }
        .btn-primary { background: #fff; color: #000; }
        .btn-primary:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(255,255,255,0.15); }
        .btn-secondary { color: #fff; background: var(--glass); backdrop-filter: blur(10px); }

        /* --- 5. 作品区动画应用 --- */
        .work-section { padding: 100px 10%; }
        .section-title { font-size: 14px; color: rgba(255,255,255,0.3); margin-bottom: 60px; letter-spacing: 5px; text-transform: uppercase; }
        
        .work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        
        .work-card { 
            background: var(--glass); border: 1px solid var(--border); border-radius: 30px;
            padding: 15px; text-decoration: none; color: #fff;
            opacity: 0; /* 初始隐藏 */
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 项目紧随文字后出现 */
        #work-01 { animation-delay: 0.9s; }
        #work-02 { animation-delay: 1.1s; }

        .work-card:hover { transform: translateY(-12px); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.06); }
        .work-img { width: 100%; aspect-ratio: 16/10; background: #111; border-radius: 20px; overflow: hidden; }
        .work-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .work-info { padding: 25px 15px 15px; }
